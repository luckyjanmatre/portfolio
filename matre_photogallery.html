<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Photo Gallery | Lucky Jan</title>
	<style>	
		body {
			background-color: #ceb5b7;
			margin: 0;
			font-family: Arial, sans-serif;
		}

		.header {
			text-align: center;
			background-color: #FFDFD3;
			border: 3px solid black;
			border-radius: 10px;
			padding: 30px;
			margin: 20px;
		}

		.pics {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 20px;
			margin: 30px 0;
			padding: 0 20px;
		}

		.pics img {
			border: 5px solid black;
			border-radius: 10px;
			max-width: 100%;
			height: auto;
			width: 300px;
			transition: transform 0.3s ease;
		}

		.pics img:hover {
			transform: scale(1.05);
		}

		.back {
			background-color: #FFDFD3;
			border: 3px solid black;
			border-radius: 20px;
			padding: 15px 30px;
			margin: 30px auto;
			text-align: center;
			width: fit-content;
			font-weight: bold;
		}

		.back a {
			text-decoration: none;
			color: black;
		}

		.back a:hover {
			text-decoration: underline;
		}

		footer {
			background-color: #FFDFD3;
			border-top: 3px solid black;
			text-align: center;
			padding: 10px;
			font-weight: bold;
			margin-top: 40px;
		}
	</style>
</head>
<body>

	<header class="header">
		<h1>Photo Gallery</h1>
		<p>This is the photo gallery of Mr. Lucky Jan Matre.</p>
	</header>

	<main>
		<div class="pics">
			<img src="itsme.jpg" alt="Lucky Jan - Image 1">
			<img src="myself.jpg" alt="Lucky Jan - Image 2">
			<img src="itsyouu.jpg" alt="Lucky Jan - Image 3">
		</div>

		<div class="back">
			<a href="index.html">← Go Back to Home</a>
		</div>
	</main>

	<footer>
		<p>&copy; Lucky Jan Matre 2024.</p>
	</footer>

</body>
</html>
